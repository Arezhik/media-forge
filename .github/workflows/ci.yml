# Phase 0: Linux and macOS package tests. No universal app job yet.
# Swift 6.2.4 is pinned here and in AGENTS.md. Change both together.
#
# Phase 1 path filters (comments only; not active yet):
# When apps are imported, an app's jobs should run only when Apps/<app>/**
# or Packages/MediaForge/** changes. For example:
#   paths:
#     - "Apps/mkvforge/**"
#     - "Packages/MediaForge/**"
#     - ".github/workflows/ci.yml"
# Same idea for Apps/pgs2srt/** and Apps/mp4subrip/**.
# Do not add working path filters until Phase 1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests
    runs-on: ubuntu-latest
    container:
      image: swift:6.2.4
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test MediaForge
        run: swift test --package-path Packages/MediaForge -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build MediaForge
        run: swift build --package-path Packages/MediaForge -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test root umbrella
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos-tests:
    name: macOS tests
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test MediaForge
        run: swift test --package-path Packages/MediaForge -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build MediaForge
        run: swift build --package-path Packages/MediaForge -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test root umbrella
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
