# MKVForge CI for the app at Apps/MKVForge.
# Three jobs: Linux tests (the same gate cloud agents run), macOS tests, and the
# universal unsigned app with MKVForge-universal.zip as the download.
# Swift 6.2.4 is pinned here, in Apps/MKVForge/.cursor/environment.json, and in
# Apps/MKVForge/AGENTS.md. Change all three together (Apps/MKVForge/docs/LESSONS.md L18).
# $GITHUB_WORKSPACE is the monorepo root. Run steps use Apps/MKVForge as the
# working directory. Build directories, the zip, and upload-artifact paths include
# Apps/MKVForge because they are relative to the repo root, not the working directory.
name: MKVForge CI

on:
  push:
    branches: [main]
    paths: ['Apps/MKVForge/**', 'Packages/MediaForge/**', 'scripts/**', '.github/workflows/mkvforge.yml']
  pull_request:
    paths: ['Apps/MKVForge/**', 'Packages/MediaForge/**', 'scripts/**', '.github/workflows/mkvforge.yml']

concurrency:
  group: mkvforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: MKVForge Linux tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/MKVForge
    container:
      image: swift:6.2.4
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install system packages
        # Keep this list the same as the apt line in Apps/MKVForge/.cursor/environment.json.
        run: apt-get update -qq && apt-get install -y --no-install-recommends mkvtoolnix

      - name: Version is in sync
        # project.pbxproj, project.yml, and CHANGELOG.md must agree.
        # Apps/MKVForge/scripts/bump-version.sh forwards to the repo-root
        # scripts/bump-version.sh mkvforge.
        run: bash scripts/bump-version.sh --check

      - name: Build number is above the base branch
        # Two PRs that bump at once collide (Apps/MKVForge/docs/LESSONS.md L20).
        # When the base branch has no Apps/MKVForge yet, skip. Otherwise compare
        # this branch to the base's Apps/MKVForge files.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          if ! git cat-file -e "origin/$BASE:Apps/MKVForge/CHANGELOG.md" 2>/dev/null; then
            echo "origin/$BASE has no Apps/MKVForge (git cat-file -e origin/$BASE:Apps/MKVForge/CHANGELOG.md failed); skipping build-number comparison."
            exit 0
          fi
          bash scripts/bump-version.sh --check-against "origin/$BASE"

      - name: Project files are consistent
        # App sources vs project.pbxproj, project.yml vs pbxproj, case-only path clashes (L17, L19).
        run: bash scripts/check-project.sh

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos-tests:
    name: MKVForge macOS tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/MKVForge
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos:
    name: MKVForge macOS universal app
    # Use a runner whose Xcode matches the Mac you test on (for example a self-hosted
    # or larger runner label). Hosted images can lag or carry framework bugs, so keep
    # framework-heavy unit tests on the macos-tests job. Generated with: macos-latest
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/MKVForge
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve local package
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MKVForge/build" "$GITHUB_WORKSPACE/Apps/MKVForge/.build"
          set +e
          LOG=$(xcodebuild \
            -resolvePackageDependencies \
            -project "$GITHUB_WORKSPACE/Apps/MKVForge/App/MKVForge.xcodeproj" \
            -scheme MKVForge \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MKVForge/build" 2>&1)
          code=$?
          set -e
          echo "$LOG"
          test "$code" -eq 0
          echo "$LOG" | grep -q "MKVForgeKit"
          echo "$LOG" | grep -qi "resolved source packages"
          if echo "$LOG" | grep -q "Missing package product"; then
            echo "Package products did not bind"
            exit 1
          fi

      - name: Build Debug app
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MKVForge/build-debug"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MKVForge/App/MKVForge.xcodeproj" \
            -scheme MKVForge \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MKVForge/build-debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          BIN="$GITHUB_WORKSPACE/Apps/MKVForge/build-debug/Build/Products/Debug/MKVForge.app/Contents/MacOS/MKVForge"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "$GITHUB_WORKSPACE/Apps/MKVForge/build-debug" -type f -path '*/Debug/MKVForge.app/Contents/MacOS/MKVForge' | head -1)"
          fi
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Debug architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          if echo "$ARCHS" | grep -qw x86_64; then
            echo "Debug My Mac build included Intel. ONLY_ACTIVE_ARCH should keep it to arm64."
            exit 1
          fi

      - name: Build UI tests for testing
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MKVForge/build-uitests"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MKVForge/App/MKVForge.xcodeproj" \
            -scheme MKVForge-UITests \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MKVForge/build-uitests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Build universal app
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MKVForge/App/MKVForge.xcodeproj" \
            -scheme MKVForge \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MKVForge/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify both architectures and zip
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/Apps/MKVForge/build/Build/Products/Release/MKVForge.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$GITHUB_WORKSPACE/Apps/MKVForge/build" -type d -name 'MKVForge.app' | head -1)"
          fi
          test -d "$APP"
          BIN="$APP/Contents/MacOS/MKVForge"
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          INFO="$APP/Contents/Info.plist"
          test -f "$INFO"
          plutil -extract CFBundleIdentifier raw "$INFO" | grep -qx com.arezhik.MKVForge
          # The app icon (L33): actool compiled App/Assets.xcassets into the bundle.
          plutil -extract CFBundleIconName raw "$INFO" | grep -qx AppIcon
          test -s "$APP/Contents/Resources/Assets.car"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          # MKVForge takes folders from Choose… buttons only, so it declares no document types.
          if plutil -extract CFBundleDocumentTypes xml1 -o - "$INFO" >/dev/null 2>&1; then
            echo "Info.plist should not declare CFBundleDocumentTypes (no drag and drop or Open With)"
            exit 1
          fi
          ENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          if printf '%s' "$ENTS" | grep -q 'com.apple.security.app-sandbox'; then
            echo "App Sandbox should stay off so output files can be written next to the input"
            exit 1
          fi
          # Ad-hoc signature (no identity, no secrets): seals the bundle so macOS lets
          # testers' copies post the batch-finished notification (Phase 5 Q6).
          codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/Apps/MKVForge/MKVForge-universal.zip"
          test -s "$GITHUB_WORKSPACE/Apps/MKVForge/MKVForge-universal.zip"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          path: Apps/MKVForge/MKVForge-universal.zip
          if-no-files-found: error
          archive: false
