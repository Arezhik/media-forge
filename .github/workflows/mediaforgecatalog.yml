# MediaForgeCatalog CI for the internal catalog at Apps/MediaForgeCatalog.
# Three jobs: Linux tests (the static catalog index), macOS tests, and the
# universal unsigned app with MediaForgeCatalog-universal.zip as the download.
# The catalog is not shipped. release.yml does not list it.
# Swift 6.2.4 is pinned here (container image swift:6.2.4).
# $GITHUB_WORKSPACE is the monorepo root. Run steps use Apps/MediaForgeCatalog as the
# working directory. Build directories, the zip, and upload-artifact paths include
# Apps/MediaForgeCatalog because they are relative to the repo root, not the working directory.
name: MediaForgeCatalog CI

on:
  push:
    branches: [main]
    paths: ['Apps/MediaForgeCatalog/**', 'Packages/MediaForge/**', 'scripts/**', '.github/workflows/mediaforgecatalog.yml']
  pull_request:
    paths: ['Apps/MediaForgeCatalog/**', 'Packages/MediaForge/**', 'scripts/**', '.github/workflows/mediaforgecatalog.yml']

concurrency:
  group: mediaforgecatalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: MediaForgeCatalog Linux tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/MediaForgeCatalog
    container:
      image: swift:6.2.4
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Version is in sync
        # project.pbxproj, project.yml, and CHANGELOG.md must agree.
        # Apps/MediaForgeCatalog/scripts/bump-version.sh forwards to the repo-root
        # scripts/bump-version.sh mediaforgecatalog.
        run: bash scripts/bump-version.sh --check

      - name: Build number is above the base branch
        # When the base branch has no Apps/MediaForgeCatalog yet, skip. Otherwise compare
        # this branch to the base's Apps/MediaForgeCatalog files.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          if ! git cat-file -e "origin/$BASE:Apps/MediaForgeCatalog/CHANGELOG.md" 2>/dev/null; then
            echo "origin/$BASE has no Apps/MediaForgeCatalog (git cat-file -e origin/$BASE:Apps/MediaForgeCatalog/CHANGELOG.md failed); skipping build-number comparison."
            exit 0
          fi
          bash scripts/bump-version.sh --check-against "origin/$BASE"

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos-tests:
    name: MediaForgeCatalog macOS tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/MediaForgeCatalog
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos:
    name: MediaForgeCatalog macOS universal app
    # Same runner as MP4SubRip. Generated with: macos-latest
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/MediaForgeCatalog
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve local package
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build" "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/.build"
          set +e
          LOG=$(xcodebuild \
            -resolvePackageDependencies \
            -project "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/App/MediaForgeCatalog.xcodeproj" \
            -scheme MediaForgeCatalog \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build" 2>&1)
          code=$?
          set -e
          echo "$LOG"
          test "$code" -eq 0
          echo "$LOG" | grep -q "MediaForgeCatalogKit"
          echo "$LOG" | grep -qi "resolved source packages"
          if echo "$LOG" | grep -q "Missing package product"; then
            echo "Package products did not bind"
            exit 1
          fi

      - name: Build Debug app
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build-debug"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/App/MediaForgeCatalog.xcodeproj" \
            -scheme MediaForgeCatalog \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build-debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          BIN="$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build-debug/Build/Products/Debug/MediaForgeCatalog.app/Contents/MacOS/MediaForgeCatalog"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build-debug" -type f -path '*/Debug/MediaForgeCatalog.app/Contents/MacOS/MediaForgeCatalog' | head -1)"
          fi
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Debug architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          if echo "$ARCHS" | grep -qw x86_64; then
            echo "Debug My Mac build included Intel. ONLY_ACTIVE_ARCH should keep it to arm64."
            exit 1
          fi

      - name: Build UI tests for testing
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build-uitests"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/App/MediaForgeCatalog.xcodeproj" \
            -scheme MediaForgeCatalog-UITests \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build-uitests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build-for-testing

      - name: Build universal app
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/App/MediaForgeCatalog.xcodeproj" \
            -scheme MediaForgeCatalog \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify both architectures and zip
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build/Build/Products/Release/MediaForgeCatalog.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/build" -type d -name 'MediaForgeCatalog.app' | head -1)"
          fi
          test -d "$APP"
          BIN="$APP/Contents/MacOS/MediaForgeCatalog"
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          INFO="$APP/Contents/Info.plist"
          test -f "$INFO"
          plutil -extract CFBundleIdentifier raw "$INFO" | grep -qx com.arezhik.MediaForgeCatalog
          plutil -extract MFCatalogCommit raw "$INFO" >/dev/null
          ENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          if printf '%s' "$ENTS" | grep -q 'com.apple.security.app-sandbox'; then
            echo "App Sandbox should stay off"
            exit 1
          fi
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/MediaForgeCatalog-universal.zip"
          test -s "$GITHUB_WORKSPACE/Apps/MediaForgeCatalog/MediaForgeCatalog-universal.zip"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          path: Apps/MediaForgeCatalog/MediaForgeCatalog-universal.zip
          if-no-files-found: error
          archive: false
