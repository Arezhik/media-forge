# MP4SubRip CI for the app at Apps/MP4SubRip.
# Three jobs: Linux tests (what cloud agents can also run), macOS tests, and the
# universal unsigned app with MP4SubRip-universal.zip as the download.
# Swift 6.2.4 is pinned here (container image swift:6.2.4).
# $GITHUB_WORKSPACE is the monorepo root. Run steps use Apps/MP4SubRip as the
# working directory. Build directories, the zip, and upload-artifact paths include
# Apps/MP4SubRip because they are relative to the repo root, not the working directory.
name: MP4SubRip CI

on:
  push:
    branches: [main]
    paths: ['Apps/MP4SubRip/**', 'Packages/MediaForge/**', 'scripts/**', '.github/workflows/mp4subrip.yml']
  pull_request:
    paths: ['Apps/MP4SubRip/**', 'Packages/MediaForge/**', 'scripts/**', '.github/workflows/mp4subrip.yml']

concurrency:
  group: mp4subrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: MP4SubRip Linux tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Apps/MP4SubRip
    container:
      image: swift:6.2.4
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Version is in sync
        # project.pbxproj, project.yml, and CHANGELOG.md must agree.
        # Apps/MP4SubRip/scripts/bump-version.sh forwards to the repo-root
        # scripts/bump-version.sh mp4subrip.
        run: bash scripts/bump-version.sh --check

      - name: Build number is above the base branch
        # When the base branch has no Apps/MP4SubRip yet, skip. Otherwise compare
        # this branch to the base's Apps/MP4SubRip files.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          if ! git cat-file -e "origin/$BASE:Apps/MP4SubRip/CHANGELOG.md" 2>/dev/null; then
            echo "origin/$BASE has no Apps/MP4SubRip (git cat-file -e origin/$BASE:Apps/MP4SubRip/CHANGELOG.md failed); skipping build-number comparison."
            exit 0
          fi
          bash scripts/bump-version.sh --check-against "origin/$BASE"

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos-tests:
    name: MP4SubRip macOS tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/MP4SubRip
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

  macos:
    name: MP4SubRip macOS universal app
    # PGS2SRT runs this job on a runner labeled "xcode-27" so the build matches the
    # Xcode on Arezhik's Mac. Generated with: macos-latest
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Apps/MP4SubRip
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve local package
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MP4SubRip/build" "$GITHUB_WORKSPACE/Apps/MP4SubRip/.build"
          set +e
          LOG=$(xcodebuild \
            -resolvePackageDependencies \
            -project "$GITHUB_WORKSPACE/Apps/MP4SubRip/App/MP4SubRip.xcodeproj" \
            -scheme MP4SubRip \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MP4SubRip/build" 2>&1)
          code=$?
          set -e
          echo "$LOG"
          test "$code" -eq 0
          echo "$LOG" | grep -q "MP4SubRipKit"
          echo "$LOG" | grep -qi "resolved source packages"
          if echo "$LOG" | grep -q "Missing package product"; then
            echo "Package products did not bind"
            exit 1
          fi

      - name: Build Debug app
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/Apps/MP4SubRip/build-debug"
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MP4SubRip/App/MP4SubRip.xcodeproj" \
            -scheme MP4SubRip \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MP4SubRip/build-debug" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          BIN="$GITHUB_WORKSPACE/Apps/MP4SubRip/build-debug/Build/Products/Debug/MP4SubRip.app/Contents/MacOS/MP4SubRip"
          if [ ! -f "$BIN" ]; then
            BIN="$(find "$GITHUB_WORKSPACE/Apps/MP4SubRip/build-debug" -type f -path '*/Debug/MP4SubRip.app/Contents/MacOS/MP4SubRip' | head -1)"
          fi
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Debug architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          if echo "$ARCHS" | grep -qw x86_64; then
            echo "Debug My Mac build included Intel. ONLY_ACTIVE_ARCH should keep it to arm64."
            exit 1
          fi

      - name: Build universal app
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/Apps/MP4SubRip/App/MP4SubRip.xcodeproj" \
            -scheme MP4SubRip \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/Apps/MP4SubRip/build" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify both architectures and zip
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/Apps/MP4SubRip/build/Build/Products/Release/MP4SubRip.app"
          if [ ! -d "$APP" ]; then
            APP="$(find "$GITHUB_WORKSPACE/Apps/MP4SubRip/build" -type d -name 'MP4SubRip.app' | head -1)"
          fi
          test -d "$APP"
          BIN="$APP/Contents/MacOS/MP4SubRip"
          test -f "$BIN"
          lipo -info "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64
          INFO="$APP/Contents/Info.plist"
          test -f "$INFO"
          plutil -extract CFBundleIdentifier raw "$INFO" | grep -qx com.arezhik.MP4SubRip
          plutil -extract CFBundleDocumentTypes.0.LSItemContentTypes.0 raw "$INFO" | grep -qx public.folder
          ENTS="$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)"
          if printf '%s' "$ENTS" | grep -q 'com.apple.security.app-sandbox'; then
            echo "App Sandbox should stay off so output files can be written next to the input"
            exit 1
          fi
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/Apps/MP4SubRip/MP4SubRip-universal.zip"
          test -s "$GITHUB_WORKSPACE/Apps/MP4SubRip/MP4SubRip-universal.zip"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          path: Apps/MP4SubRip/MP4SubRip-universal.zip
          if-no-files-found: error
          archive: false
